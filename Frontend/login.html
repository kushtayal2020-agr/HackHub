<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - HackHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hackathon.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p class="muted">Sign in to your HackHub account</p>
      </div>

      <div id="auth-error" class="alert alert-danger" hidden></div>

      <form id="login-form" class="stack" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <div class="auth-footer">
        <p class="muted">Don't have an account? <a href="register.html">Register here</a></p>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="js/hh-utils.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/notifications-bell.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
