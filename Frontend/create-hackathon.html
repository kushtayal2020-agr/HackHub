<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host a Hackathon - HackHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hackathon.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container">
    <div style="max-width: 800px; margin: 24px auto;">
      <div style="margin-bottom: 24px;">
        <h1 id="page-title" style="margin-bottom:6px;">Create Hackathon Event</h1>
        <p class="muted">Define event timelines, eligibility rules, and prize pools.</p>
      </div>

      <form id="hackathon-form" class="stack" novalidate style="background:var(--bg-surface); padding:32px; border:1px solid var(--border-color); border-radius:var(--radius-md); box-shadow:var(--shadow-sm);">
        <div class="form-group">
          <label for="title">Hackathon Title *</label>
          <input name="title" id="title" placeholder="e.g. Inter-College AI Innovation Sprint 2026" required>
        </div>

        <div class="form-group">
          <label for="theme">Primary Theme / Domain</label>
          <input name="theme" id="theme" placeholder="e.g. AI & Machine Learning, Web3, FinTech">
        </div>

        <div class="form-group">
          <label for="description">Event Description</label>
          <textarea name="description" id="description" rows="4" placeholder="Brief overview of challenges, problem statements, and target audience..."></textarea>
        </div>

        <div class="form-group">
          <label for="rules">Hackathon Rules &amp; Submission Guidelines</label>
          <textarea name="rules" id="rules" rows="4" placeholder="Rules regarding team composition, original work, code repositories, etc."></textarea>
        </div>

        <div class="form-group">
          <label for="prizes">Prize Distribution Details</label>
          <input name="prizes" id="prizes" placeholder="e.g. 1st: ₹50,000, 2nd: ₹30,000, 3rd: ₹20,000">
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="registration_start">Registration Starts *</label>
            <input type="datetime-local" id="registration_start" name="registration_start" required>
          </div>
          <div class="form-group">
            <label for="registration_end">Registration Ends *</label>
            <input type="datetime-local" id="registration_end" name="registration_end" required>
          </div>
          <div class="form-group">
            <label for="start_date">Hackathon Starts (Building Opens) *</label>
            <input type="datetime-local" id="start_date" name="start_date" required>
          </div>
          <div class="form-group">
            <label for="end_date">Hackathon Ends (Submissions Close) *</label>
            <input type="datetime-local" id="end_date" name="end_date" required>
          </div>
        </div>

        <div class="form-group">
          <label for="max_team_size">Maximum Team Size (Default 4)</label>
          <input type="number" id="max_team_size" name="max_team_size" min="1" max="10" value="4">
        </div>

        <div class="form-group">
          <label for="banner">Banner Image (JPG, PNG or WEBP, max 2 MB)</label>
          <input type="file" id="banner" name="banner" accept="image/png,image/jpeg,image/webp">
        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:12px;">
          <a href="my-hackathons.html" class="btn btn-secondary">Cancel</a>
          <button class="btn btn-primary" id="save-btn" type="submit">
            Save Hackathon Event
          </button>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom text-center">
      <p class="muted">&copy; 2026 HackHub. College PBL Innovation Platform &bull; <a href="privacy.html">Privacy</a> &bull; <a href="terms.html">Terms</a> &bull; <a href="rules.html">Rules</a></p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="js/hh-utils.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/notifications-bell.js"></script>
  <script src="js/hackathon-form.js"></script>
</body>
</html>
