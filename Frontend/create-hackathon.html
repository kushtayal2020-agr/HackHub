<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hackathon Form - HackHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hackathon.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container">
    <h1 id="page-title">Create Hackathon</h1>
    <form id="hackathon-form" class="stack" novalidate>
      <label>Title *<input name="title" required></label>
      <label>Theme<input name="theme"></label>
      <label>Description<textarea name="description" rows="4"></textarea></label>
      <label>Rules<textarea name="rules" rows="4"></textarea></label>
      <label>Prizes<input name="prizes"></label>
      <div class="grid-2">
        <label>Registration starts *<input type="datetime-local" name="registration_start" required></label>
        <label>Registration ends *<input type="datetime-local" name="registration_end" required></label>
        <label>Hackathon starts *<input type="datetime-local" name="start_date" required></label>
        <label>Hackathon ends *<input type="datetime-local" name="end_date" required></label>
      </div>
      <label>Max team size<input type="number" name="max_team_size" min="1" max="10" value="4"></label>
      <label>Banner image (JPG, PNG or WEBP, max 2 MB)<input type="file" name="banner" accept="image/png,image/jpeg,image/webp"></label>
      <button class="btn" id="save-btn">Save hackathon</button>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="js/hh-utils.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/notifications-bell.js"></script>
  <script src="js/hackathon-form.js"></script>
</body>
</html>
