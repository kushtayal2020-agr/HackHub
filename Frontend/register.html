<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - HackHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hackathon.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Create an Account</h1>
        <p class="muted">Join HackHub as a participant, organiser, or judge</p>
      </div>

      <div id="auth-error" class="alert alert-danger" hidden></div>
      <div id="auth-success" class="alert alert-success" hidden></div>

      <form id="register-form" class="stack" novalidate>
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" placeholder="John Doe" minlength="2" maxlength="100" required>
        </div>

        <div class="form-group">
          <label for="email">Email address *</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="password">Password * (min 8 chars, 1 digit)</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="confirm_password">Confirm Password *</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required autocomplete="new-password">
          </div>
        </div>

        <div class="form-group">
          <label for="role">Role *</label>
          <select id="role" name="role" required>
            <option value="participant" selected>Participant (Join teams, submit projects)</option>
            <option value="organiser">Organiser (Host hackathons, manage judging)</option>
            <option value="judge">Judge (Evaluate submissions)</option>
          </select>
        </div>

        <div id="organiser-notice" class="alert alert-info" hidden>
          <strong>Organiser notice:</strong> Organiser accounts must be approved by an administrator before you can log in.
        </div>

        <div class="form-group">
          <label for="college">College / University (Optional)</label>
          <input type="text" id="college" name="college" placeholder="XYZ Institute of Technology" maxlength="150">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>

      <div class="auth-footer">
        <p class="muted">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="js/hh-utils.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/notifications-bell.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
