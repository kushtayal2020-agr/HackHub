<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - HackHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hackathon.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <div style="display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:var(--radius-sm); background:var(--brand-primary-subtle); color:var(--brand-primary); margin-bottom:14px;">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><polyline points="16 11 18 13 22 9"></polyline></svg>
        </div>
        <h1>Create an Account</h1>
        <p class="muted">Join India's premier student innovation community</p>
      </div>

      <div id="auth-error" class="alert alert-danger" hidden></div>
      <div id="auth-success" class="alert alert-success" hidden></div>

      <form id="register-form" class="stack" novalidate>
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" placeholder="John Doe" minlength="2" maxlength="100" required>
        </div>

        <div class="form-group">
          <label for="email">College / Institutional Email *</label>
          <input type="email" id="email" name="email" placeholder="student@college.edu" required autocomplete="email">
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="password">Password * (min 8 chars, 1 digit)</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="confirm_password">Confirm Password *</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required autocomplete="new-password">
          </div>
        </div>

        <div class="form-group">
          <label for="role">Account Role *</label>
          <select id="role" name="role" required>
            <option value="participant" selected>Participant (Join teams, submit project code)</option>
            <option value="organiser">Organiser (Host hackathons, manage rubrics)</option>
            <option value="judge">Judge (Impartial evaluation panelist)</option>
          </select>
        </div>

        <div id="organiser-notice" class="alert alert-info" hidden>
          <strong>Organiser notice:</strong> Organiser accounts are submitted for administrative approval before event hosting privileges are activated.
        </div>

        <div class="form-group">
          <label for="college">College / University Name (Optional)</label>
          <input type="text" id="college" name="college" placeholder="e.g. Indian Institute of Technology" maxlength="150">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:8px;">
          Create Free Account
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="auth-footer">
        <p class="muted">Already registered? <a href="login.html">Sign in here</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom text-center">
      <p class="muted">&copy; 2026 HackHub. College PBL Innovation Platform &bull; <a href="privacy.html">Privacy</a> &bull; <a href="terms.html">Terms</a></p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="js/hh-utils.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/notifications-bell.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
