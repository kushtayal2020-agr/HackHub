<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hackathons - HackHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hackathon.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container">
    <div style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; margin: 20px 0 10px;">
      <div>
        <h1 style="margin-bottom:6px;">Explore Hackathons</h1>
        <p class="muted" style="margin-bottom:0;">Discover innovation challenges, join teams, and showcase your skills.</p>
      </div>
      <a href="create-hackathon.html" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Host a Hackathon
      </a>
    </div>

    <div class="filter-bar">
      <div class="filter-search-wrap">
        <svg class="filter-search-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="search" placeholder="Search hackathons by title, keywords or description...">
      </div>
      <select id="theme" aria-label="Filter by theme">
        <option value="">All Themes</option>
      </select>
      <select id="status" aria-label="Filter by status">
        <option value="">All Statuses</option>
        <option value="upcoming">Upcoming</option>
        <option value="live">Live</option>
        <option value="completed">Completed</option>
      </select>
    </div>

    <div id="list" class="card-grid"></div>
    <div id="empty" class="alert alert-info text-center pad" style="margin-top:24px;" hidden>
      No hackathons found matching your criteria. Try adjusting your filters.
    </div>
    <div id="pagination" class="pagination"></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom text-center">
      <p class="muted">&copy; 2026 HackHub. College PBL Innovation Platform &bull; <a href="privacy.html">Privacy</a> &bull; <a href="terms.html">Terms</a> &bull; <a href="rules.html">Rules</a></p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="js/hh-utils.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/notifications-bell.js"></script>
  <script src="js/hackathons.js"></script>
</body>
</html>
