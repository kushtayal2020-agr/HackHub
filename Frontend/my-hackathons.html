<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Hackathons - HackHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/hackathon.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container">
    <h1>My Hackathons</h1>
    <p><a class="btn" href="create-hackathon.html">+ Create hackathon</a></p>
    <div class="table-wrap">
      <table class="data">
        <thead>
          <tr>
            <th>Title</th>
            <th>Approval</th>
            <th>Status</th>
            <th>Starts</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="muted" hidden>You have not created any hackathon yet.</p>
  </main>

  <script src="config.js"></script>
  <script src="js/hh-utils.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/notifications-bell.js"></script>
  <script src="js/my-hackathons.js"></script>
</body>
</html>
