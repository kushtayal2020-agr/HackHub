version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: hackhub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password_2026
      MYSQL_DATABASE: hackhub
      MYSQL_USER: hackhub_user
      MYSQL_PASSWORD: hackhub_password_2026
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema_deploy.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackhub-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: hackhub_user
      DB_PASSWORD: hackhub_password_2026
      DB_NAME: hackhub
      JWT_SECRET: c6a8e104f2b1d7e8a930129bcdef44917a123bc89104fae10928374a01928bc
      FRONTEND_URL: http://localhost:8080,http://localhost:5500
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

  web:
    image: nginx:alpine
    container_name: hackhub-web
    restart: always
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html:ro

volumes:
  db_data:
  uploads_data:
